      orcid: 0000-0001-9513-2660
      corresponding: true
      affiliations:
        - id: uiowa
          name: Department of Electrical and Computer Engineering, University of Iowa
          address: Iowa City, IA, USA
    # Verified-ORCID registry of active ITK contributors (ORCID public API,
