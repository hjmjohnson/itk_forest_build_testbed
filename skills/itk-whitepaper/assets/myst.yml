  # License and access (IJ standard: Apache-2.0 code, CC-BY-4.0 content)
  license:
    code: Apache-2.0
    content: CC-BY-4.0
  open_access: true

  numbering:
    figure: true
    table: true
    equation: true

  # Repository link -- point at your paper's repo
  github: hjmjohnson/REPLACE-WITH-REPO

  venue:
    title: Insight Journal
    url: https://insight-journal.org

  exports:
    - format: typst
      template: lapreprint-typst
      output: exports/manuscript.pdf
    - format: cff
    - format: meca
      output: exports/article.meca.zip

  toc:
    - file: docs/index.md

  resources:
    - src/**
    - data/**

  bibliography:
    - docs/references.bib
