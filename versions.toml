# versions.toml — source of truth for the forest build component versions.
#
# The build engine (bin/setup-itk-downstream-testbed.sh, via bin/config.py)
# reads this file to learn each component's git URL, worktree branch, and the
# default ref to build. Edit versions here, not in the engine shell code.
#
# Precedence (unchanged): environment variable > this file > built-in fallback.
# e.g. `ITK_REF=pr/6250 pixi run repoint-itk` still overrides components.ITK.ref.
#
# Each [components.<Name>] entry:
#   url     git remote to clone into forest_git_repos/<Name> (required)
#   ref     default ref the worktree is built at (branch/tag/SHA); default "origin/main"
#   branch  worktree patch-branch name; default "<name>-itk-downstream" (consumers)
#   kind    "consumer" (default) or "remote" (ITK remote module built externally)
#   heavy   remotes only: true => CUDA/Java/wasm, skipped unless HEAVY=1

# ----------------------------------------------------------------------------
# Main consumers
# ----------------------------------------------------------------------------
