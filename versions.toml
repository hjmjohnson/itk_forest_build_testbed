# ----------------------------------------------------------------------------
# SuperBuild-internal dependency pins the engine passes as -D... overrides.
# These select sources cloned by a consumer's own SuperBuild, not forest trees.
# ----------------------------------------------------------------------------
[subbuild.Slicer]
# Slicer always builds its own vendored ITK branch; never the system ITK.
#
# RULE: the vendored branch DERIVES FROM THE FOREST'S OWN ITK BASE -- forest on
# release-5.4 => Slicer ITK = release-5.4 + itk5 Slicer patches; forest on main
# => Slicer ITK = main + itk6 Slicer patches. So ITK_GIT_TAG is PER-FOREST and
# lives in [scenarios.<suffix>.Slicer] below. See docs/slicer-itk-policy.md for
# the rule and the minting recipe.
#
# No global ITK_GIT_TAG on purpose: a forest without a declared variant must
# FAIL (config.py subbuild-get exits non-zero) rather than silently inherit
# another forest's ITK. A wrong Slicer ITK surfaces hours later as an unrelated
# link error -- see docs/slicer-itk-policy.md "How this fails silently".
ITK_GIT_REPOSITORY = "https://github.com/hjmjohnson/ITK"

# SlicerExecutionModel is deliberately NOT bumped off Slicer's own 91b921bd
# (2025-01-20) default. Bumping to 56ed0944 (2026-06-16) breaks the Slicer
# build: that revision's vendored tclap declares
#   CmdLineOutput.h:39  const char PATH_SEPARATOR = ...
# while DCMTK's osconfig.h:436 does
#   #define PATH_SEPARATOR '/'
# so any TU including both -- e.g. BRAINSTools/DWIConvert/DWIConvert.cxx via
# DWIConvertCLP.h -- expands the macro into the declaration:
#   error: expected unqualified-id
# "Stale" was not a sufficient reason to move it; landing this needs the
# name collision resolved upstream in SlicerExecutionModel or DCMTK first.
#
# Pinned EXPLICITLY to Slicer's own default rather than left unset: once a
# forest has configured with a different tag, that value lives in Slicer's
# CMake cache, and an unset pin gives the drift check nothing to compare, so
# the cache silently wins. Declaring the intended value is what pulls it back.
SlicerExecutionModel_GIT_REPOSITORY = "https://github.com/Slicer/SlicerExecutionModel.git"
SlicerExecutionModel_GIT_TAG        = "91b921bd5977c3384916ba4b03705d87b26067f7"

[subbuild.BRAINSTools]
# Consumed via the overridable BRAINSTools_ANTs_GIT_* vars (BRAINSia/BRAINSTools#605).
ANTs_GIT_REPOSITORY = "https://github.com/ANTsX/ANTs.git"
ANTs_GIT_TAG        = "2a25b6b032b01680a558b6fbc767f056ccd144e1"

[subbuild.SlicerANTs]
# netstim/SlicerANTs defaults its ANTs EP to 8c4e2077 (2024.09.10) -- ~2 years
# stale, so the extension exercises an ANTs that predates the ITKv6 fixes the
# forest tests against. Its External_ANTs.cmake uses
# ExternalProject_SetIfNotDefined, so the environment variable inner_ANTs_GIT_*
# overrides it without patching the extension (extension CMakeCache args are a
# closed whitelist; only the environment gets through). Kept in step with
# subbuild.BRAINSTools above.
ANTs_GIT_REPOSITORY = "https://github.com/ANTsX/ANTs.git"
ANTs_GIT_TAG        = "2a25b6b032b01680a558b6fbc767f056ccd144e1"

[subbuild.BoneTextureExtension]
# Two ITK remote modules pinned by BoneTextureExtension via
# ExternalProject_SetIfNotDefined, overridden through inner_<proj>_GIT_*
# environment variables (see the SlicerExtensions block in
# bin/setup-itk-downstream-testbed.sh). Both defaults predate ITKv6, so the
# extension built green while proving nothing about the ITK under test.
# ITKTextureFeature default: 7643fb34 (2019-08-22); ITKBoneMorphometry: 7d4314f1 (2020-03-01).
#
# NOT pinned to upstream tip: both modules were ingested into ITK proper and
# their repos archived, which DELETES CMakeLists.txt. Pinning at tip yields
#   CMake Error: The source directory ... does not appear to contain CMakeLists.txt
# so each pin is the last commit before its archival commit.
#   ITKTextureFeatures  archived 7ef56458 (2026-05-13) -> use 06571a93 (2026-04-22)
#   ITKBoneMorphometry  archived 218ece21 (2026-05-27) -> use bbd753fe (2026-04-29)
# The real fix is upstream in BoneTextureExtension: drop both ExternalProjects
# and use ITK's now-built-in modules. These pins keep it building until then.
ITKTextureFeature_GIT_REPOSITORY  = "https://github.com/InsightSoftwareConsortium/ITKTextureFeatures.git"
ITKTextureFeature_GIT_TAG         = "06571a93cfed79930cba30920e5fa0c665b05049"
ITKBoneMorphometry_GIT_REPOSITORY = "https://github.com/InsightSoftwareConsortium/ITKBoneMorphometry.git"
ITKBoneMorphometry_GIT_TAG        = "bbd753fe1977319783ffa6b1cef5ecf061873ca5"

[subbuild.PlusLib]
# Test data (TestImages/ConfigFiles/CADModels) the PlusLib tests read from;
# cloned shallow into forest_git_repos/PlusLibData and passed as PLUSLIB_DATA_DIR.
data_url = "https://github.com/PlusToolkit/PlusLibData.git"

[subbuild.Plastimatch]
# Plastimatch builds from a maintained ITKv6-support fork branch.
fork_remote = "hjmjohnson"
fork_url    = "git@gitlab.com:hjmjohnson/plastimatch.git"
fork_ref    = "itkv6-support"

# ----------------------------------------------------------------------------
# Toolchain knobs that gate version-sensitive consumers
# ----------------------------------------------------------------------------
[toolchain]
slicer_qt_version = "6.9.1"        # Qt version the Slicer SuperBuild requires

# ----------------------------------------------------------------------------
# Per-scenario consumer overrides — applied ONLY when FOREST_REFERENCE_SUFFIX
# equals the scenario key. Lets one build scenario point a consumer at a fork's
# demo-<suffix> staging branch (assembled by the gh-demo-branch skill) instead
# of the upstream default, without affecting other forests. Shape:
#   [scenarios.<FOREST_REFERENCE_SUFFIX>.<ComponentName>]
#   url = "<fork git url>" ; branch = "demo-<suffix>"
# ----------------------------------------------------------------------------
# --- TractographyTRX: TEMPORARY integration branch until two interdependent PRs
# merge upstream. The module PINS trx-cpp, so testing the ITK v5 fix needs BOTH
# plus a pin bump; itk-forest-integration carries all three:
#   tee-ar-ex/ITKTractographyTRX#30 -- ITK v5/v6 build-glue (zlib/Eigen targets)
#   tee-ar-ex/trx-cpp#52            -- get_ext reads the final path component
#   + a pin bump: TRX_CPP_GIT_TAG -> hjmjohnson/trx-cpp@itk-forest-integration (11d0c81)
# Verified: builds + 9/9 module tests on both ITK 5.4.6 and 6.0.0. Delete these
# two scenarios once #30 and #52 land and the pin is bumped to a merged trx-cpp SHA.
# (quote the dotted suffix so "5.4" is not parsed as a TOML key separator)
["scenarios"."itk-release-5.4"."TractographyTRX"]
url    = "https://github.com/hjmjohnson/ITKTractographyTRX.git"
branch = "itk-forest-integration"

[scenarios.itk-main.TractographyTRX]
url    = "https://github.com/hjmjohnson/ITKTractographyTRX.git"
branch = "itk-forest-integration"

# --- SlicerFreeSurfer: build against PerkLab/SlicerFreeSurfer#23 until it merges.
# The FreeSurferMarkups module segfaulted in its auto-generated WidgetGenericTest
# (unguarded this->logic()->GetMRMLApplicationLogic()->GetModuleLogic() chain);
# the fix branch is master + that one null-guard. Extension integration branches
# ride the ExtensionsIndex DESCRIPTOR, not a forest worktree: url/revision here
# rewrite the descriptor's scm_url/scm_revision. Version-independent, so wired
# for both forests. Delete once #23 merges. (quote the dotted 5.4 suffix)
["scenarios"."itk-release-5.4"."extensions"."SlicerFreeSurfer"]
url      = "https://github.com/hjmjohnson/SlicerFreeSurfer.git"
revision = "fix-freesurfermarkups-setup-null-guard"

[scenarios.itk-main.extensions.SlicerFreeSurfer]
url      = "https://github.com/hjmjohnson/SlicerFreeSurfer.git"
revision = "fix-freesurfermarkups-setup-null-guard"

# BRAINSTools#616 (MIH baselines for ITK's corrected JointHistogramMutualInformation
# metric, ITK#6569) merged 2026-07-21. The integration-branch scenario is retired;
# both forests now track origin/main, whose selector is ITK_VERSION VERSION_LESS 6.0
# -- legacy baselines on v5, post-ITK6569 baselines on v6 -- so one upstream tree
# serves both forests. Slicer's SuperBuild.cmake pin (dbb02b6a, on the Slicer
# integration branch) is an ancestor of origin/main, so that workaround can be
# dropped once Slicer advances its own pin.

# --- Slicer's vendored ITK: one variant per forest, derived from that forest's
# ITK base + the Slicer patches for that ITK major. Mint per
# docs/slicer-itk-policy.md; never point two forests at one branch.
# Naming: slicer-v<ITK version>-<YYYY-MM-DD>-<base short sha>

# NOTE the quotes: a bare [scenarios.itk-release-5.4.Slicer] would parse the
# dot in "5.4" as a TOML key separator (scenarios.itk-release-5.4.Slicer ->
# scenarios/itk-release-5/4/Slicer) and silently never match this forest.
["scenarios"."itk-release-5.4"."Slicer"]
# upstream/release-5.4 @ 9cd63da191e (ITK 5.4.6) + itk5 Slicer patches:
#   custom ITK namespace, itkFileTools build fix
ITK_GIT_TAG = "slicer-v5.4.6-2026-07-17-9cd63da191e"
# Same integration branch as itk-main: both forests build Slicer from the same
# upstream tip, and the BRAINSTools bump is not ITK-version specific -- it moves
# an 8-month-old pin to a current one. ITK 5.4 does not NEED it (the DCMTK
# reader header is still public there), but building both forests against the
# same BRAINSTools keeps this a controlled comparison: an extension that
# differs between forests then differs because of ITK, not because one side
# built a 2025-11 BRAINSTools and the other a 2026-07 one.
url    = "https://github.com/hjmjohnson/Slicer.git"
branch = "itk-forest-integration"

[scenarios.itk-main.Slicer]
# integration/itk-main (main + ITK #6667 tweak-version + tweak bump to 20260716,
# base e161a8a612d) + itk6 Slicer patches: custom ITK namespace only -- the
# itkFileTools fix is already upstream in main. Re-minted off the integration
# branch so Slicer's ITK is a variant of THIS forest's actual ITK base.
ITK_GIT_TAG = "slicer-v6.0.0-2026-07-20-e161a8a612d"
# Slicer's SuperBuild.cmake pins BRAINSTools at ced799ad (2025-11-10), which
# predates BRAINSTools vendoring ITK's now-private itkDCMTKFileReader.h, so
# DWIConvert fails to compile against ITK main. Slicer_Remote_Add hardcodes
# GIT_TAG (no ExternalProject_SetIfNotDefined), so there is no engine-side
# override -- the bump to dbb02b6a rides an integration branch instead.
# PENDING: mint+push hjmjohnson/Slicer@itk-forest-integration (= origin/main +
# that one-line pin bump) before the next Slicer checkout; the branch does not
# exist yet.
url    = "https://github.com/hjmjohnson/Slicer.git"
branch = "itk-forest-integration"
